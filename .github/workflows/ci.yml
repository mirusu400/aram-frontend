name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            platform: windows-amd64
            executable: aram-frontend.exe
            archive: aram-frontend-windows-amd64.zip
          - name: Linux x64
            runner: ubuntu-latest
            platform: linux-amd64
            executable: aram-frontend
            archive: aram-frontend-linux-amd64.tar.gz
          - name: macOS arm64
            runner: macos-latest
            platform: macos-arm64
            executable: aram-frontend
            archive: aram-frontend-macos-arm64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxxf86vm-dev \
            libasound2-dev pkg-config xvfb
      - name: Test
        if: runner.os != 'Linux'
        run: go test ./...
      - name: Test under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build standalone frontend
        shell: bash
        run: |
          mkdir -p build/package dist
          go build -trimpath -ldflags="-s -w" \
            -o "build/package/${{ matrix.executable }}" \
            ./cmd/aram-frontend
          cp README.md build/package/
      - name: Package Windows frontend
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path 'build/package/*' `
            -DestinationPath 'dist/${{ matrix.archive }}'
      - name: Package Unix frontend
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C build/package -czf "dist/${{ matrix.archive }}" .
      - name: Upload standalone frontend
        uses: actions/upload-artifact@v7
        with:
          name: aram-frontend-${{ matrix.platform }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  android-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Ebitengine mobile binder
        run: go install github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile@v2.9.9
      - name: Build Android AAR
        run: |
          mkdir -p build
          ebitenmobile bind \
            -target android \
            -javapkg io.github.mirusu400.aram \
            -o build/aram.aar \
            ./mobile
      - uses: actions/upload-artifact@v7
        with:
          name: aram-frontend-android-aar
          path: build/aram.aar
          if-no-files-found: error
          retention-days: 14

  ios-binding:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Ebitengine mobile binder
        run: go install github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile@v2.9.9
      - name: Build iOS XCFramework
        run: |
          mkdir -p build
          ebitenmobile bind \
            -target ios \
            -o build/ARAM.xcframework \
            ./mobile
      - uses: actions/upload-artifact@v7
        with:
          name: aram-frontend-ios-xcframework
          path: build/ARAM.xcframework
          if-no-files-found: error
          retention-days: 14

  publish-nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - desktop
      - android-binding
      - ios-binding
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: aram-frontend-windows-amd64
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: aram-frontend-linux-amd64
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: aram-frontend-macos-arm64
          path: release-assets
      - name: Verify release archives
        shell: bash
        run: |
          cd release-assets
          test -f aram-frontend-windows-amd64.zip
          test -f aram-frontend-linux-amd64.tar.gz
          test -f aram-frontend-macos-arm64.tar.gz
          sha256sum \
            aram-frontend-windows-amd64.zip \
            aram-frontend-linux-amd64.tar.gz \
            aram-frontend-macos-arm64.tar.gz \
            > SHA256SUMS.txt
      - name: Publish rolling Nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          title="Nightly ${short_sha}"
          notes="Automated main-branch build from ${GITHUB_SHA}.

          Source: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git tag --force nightly "${GITHUB_SHA}"
          git push --force origin refs/tags/nightly
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly \
              --prerelease \
              --title "${title}" \
              --notes "${notes}"
          else
            gh release create nightly \
              --verify-tag \
              --prerelease \
              --title "${title}" \
              --notes "${notes}"
          fi
          mapfile -t assets < <(find release-assets -type f -print)
          test "${#assets[@]}" -gt 0
          gh release upload nightly "${assets[@]}" --clobber

  publish-stable:
    if: github.event_name == 'release' && github.event.release.tag_name != 'nightly'
    needs:
      - desktop
      - android-binding
      - ios-binding
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: aram-frontend-windows-amd64
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: aram-frontend-linux-amd64
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: aram-frontend-macos-arm64
          path: release-assets
      - name: Verify release archives
        shell: bash
        run: |
          cd release-assets
          test -f aram-frontend-windows-amd64.zip
          test -f aram-frontend-linux-amd64.tar.gz
          test -f aram-frontend-macos-arm64.tar.gz
          sha256sum \
            aram-frontend-windows-amd64.zip \
            aram-frontend-linux-amd64.tar.gz \
            aram-frontend-macos-arm64.tar.gz \
            > SHA256SUMS.txt
      - name: Attach archives to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f -print)
          test "${#assets[@]}" -gt 0
          gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
