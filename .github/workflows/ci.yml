name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            platform: windows-amd64
            executable: aram-frontend.exe
            archive: aram-frontend-windows-amd64.zip
          - name: Linux x64
            runner: ubuntu-latest
            platform: linux-amd64
            executable: aram-frontend
            archive: aram-frontend-linux-amd64.tar.gz
          - name: macOS arm64
            runner: macos-latest
            platform: macos-arm64
            executable: aram-frontend
            archive: aram-frontend-macos-arm64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxxf86vm-dev \
            libasound2-dev pkg-config xvfb
      - name: Test
        if: runner.os != 'Linux'
        run: go test ./...
      - name: Test under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build standalone frontend
        shell: bash
        run: |
          mkdir -p build/package dist
          go build -trimpath -ldflags="-s -w" \
            -o "build/package/${{ matrix.executable }}" \
            ./cmd/aram-frontend
          cp README.md build/package/
      - name: Package Windows frontend
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path 'build/package/*' `
            -DestinationPath 'dist/${{ matrix.archive }}'
      - name: Package Unix frontend
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C build/package -czf "dist/${{ matrix.archive }}" .
      - name: Upload standalone frontend
        uses: actions/upload-artifact@v7
        with:
          name: aram-frontend-${{ matrix.platform }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  android-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Ebitengine mobile binder
        run: go install github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile@v2.9.9
      - name: Build Android AAR
        run: |
          mkdir -p build
          ebitenmobile bind \
            -target android \
            -javapkg io.github.mirusu400.aram \
            -o build/aram.aar \
            ./mobile
      - uses: actions/upload-artifact@v7
        with:
          name: aram-frontend-android-aar
          path: build/aram.aar
          if-no-files-found: error
          retention-days: 14

  ios-binding:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Ebitengine mobile binder
        run: go install github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile@v2.9.9
      - name: Build iOS XCFramework
        run: |
          mkdir -p build
          ebitenmobile bind \
            -target ios \
            -o build/ARAM.xcframework \
            ./mobile
      - uses: actions/upload-artifact@v7
        with:
          name: aram-frontend-ios-xcframework
          path: build/ARAM.xcframework
          if-no-files-found: error
          retention-days: 14
